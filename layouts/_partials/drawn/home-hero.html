<section class="drawn-home-hero">
    <div>
        <h1>{{ .Title | default site.Title }}</h1>
        {{ with .Description }}<p>{{ . }}</p>{{ end }}
        {{ with .Content }}<div class="article-content">{{ . }}</div>{{ end }}
        {{ with site.GetPage "/page/search" }}
        <form class="drawn-home-search" action="{{ .RelPermalink }}" role="search">
            <label class="drawn-visually-hidden" for="home-keyword">搜索文章、知识点或题号</label>
            <input id="home-keyword" name="keyword" type="search" placeholder="搜索文章、知识点或题号…" required>
            <button type="submit">搜索</button>
        </form>
        {{ end }}
        <div class="drawn-home-links">
            {{ with site.GetPage "/blog" }}<a href="{{ .RelPermalink }}">全部文章 →</a>{{ end }}
            {{ with site.GetPage "/tags" }}<a href="{{ .RelPermalink }}">全部标签 →</a>{{ end }}
        </div>
    </div>
</section>
