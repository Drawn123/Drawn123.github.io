name: Check theme update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
      - name: Report available theme version without changing dependencies
        run: go list -m -u github.com/CaiJimmy/hugo-theme-stack/v4
